[project]
name = "ai-docent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "google-genai>=2.30",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    # uvicorn은 WebSocket을 쓸 때 이 패키지가 있어야 한다. 11/11 회의에서 Live 음성 전환이
    # 확정돼 Live 중계(/ws/live)가 운영 경로가 되므로 기본 설치에 넣는다. live extra는 없앴다.
    "websockets>=16.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# 이미지로 작품 찾기(server/recognition.py, tools/build_index.py)에만 필요. 설치: uv sync --extra recognition
recognition = [
    "numpy>=1.26",
    "pillow>=10.0",
    "torch>=2.4",
    "transformers>=4.45",
]
