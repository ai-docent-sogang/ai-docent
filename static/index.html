<!doctype html>
<!-- 폰 웹앱 화면. 담당: FE1. 동작은 app.js, 모양은 style.css. id를 바꾸면 app.js도 함께 고친다. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Docent v0</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <video id="camera" playsinline muted autoplay></video>
  <div id="panel">
    <div id="status">Tap Start, then allow camera and microphone.</div>
    <div id="log"></div>
    <form id="text-form">
      <input id="text-input" placeholder="Or type a question" autocomplete="off">
      <button type="submit">Send</button>
    </form>
    <div id="controls">
      <button id="start">Start</button>
      <button id="talk" disabled>Hold to talk</button>
    </div>
    <div>
      <button id="test-voice" type="button">Test voice</button>
      <button id="replay" type="button" disabled>Replay reply</button>
      <div id="audio-status" role="status" aria-live="polite"></div>
    </div>
    <div id="meta"></div>

    <!-- 텍스트 전용 질문·답변(POST /api/ask) 시험 영역. 작품을 직접 고르고 질문만 보낸다.
         FE2의 화면 디자인이 들어오면 이 자리는 그쪽으로 옮긴다(docs/역할_가이드.md의 ui.js 분담). -->
    <details id="ask-box">
      <summary>Ask about one painting (text API)</summary>
      <select id="ask-artwork" aria-label="Painting"></select>
      <form id="ask-form">
        <input id="ask-input" placeholder="Ask about this painting" autocomplete="off">
        <button type="submit" id="ask-send">Ask</button>
      </form>
      <div id="ask-voice">
        <button id="ask-listen" type="button">Speak question</button>
        <span id="ask-stt-status" role="status" aria-live="polite"></span>
      </div>
      <div id="ask-meta"></div>
    </details>
  </div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
